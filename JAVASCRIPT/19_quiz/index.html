<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="row quiz-card rounded-5 shadow-lg">
        <div class="card d-flex flex-column gap-4">
          <h1 class="text-center mt-3 text-success">Quiz</h1>

          <div class="d-flex justify-content-between">
            <div id="qnsNumber" class=" text-primary fs-5"></div>
            <div class="timer fs-5 text-danger">Time Left 30s</div>
          </div>

          <h3 id="qns" class="text-center ">Question will be appear here</h3>

          <div class="row g-3" id="options">


         
          </div>

          <button id="next-btn" onclick="nextQns()" class="btn btn-outline-success mb-4 align-ite">Next Qns</button>

          <div id="quiz-result" ></div>

        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="./script.js"></script>
  </body>
</html>
